name: The CGEC Times Weekly Newsletter

on:
  schedule:
    # UTC সময় অনুযায়ী প্রতি রোববার সকাল ৯টায় (IST দুপুর ২:৩০) রান হবে
    - cron: '0 9 * * 0'
  workflow_dispatch: # GitHub ওয়েবসাইট থেকে ম্যানুয়ালি রান করার জন্য

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBER_SHEET_URL: ${{ secrets.SUBSCRIBER_SHEET_URL }}
        run: python main.py